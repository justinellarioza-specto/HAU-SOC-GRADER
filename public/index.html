<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAU SOC Grader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: LMS-style — fixed maroon global nav on the left (bottom tab bar on phones), breadcrumb bar on top, white pages with plain tables and a right-hand sidebar. Single light look by design. */
:root{
  --page:#ffffff; --soft:#f5f5f5; --ink:#2d3b45; --muted:#6b7780; --line:#c7cdd1; --line-soft:#e6e9eb;
  --brand:#8b1a24; --brand-dark:#6c121a; --brand-soft:#f8eced; --link:#8b1a24;
  --good:#127a3e; --good-soft:#e7f4ec; --warn:#a45a00; --warn-soft:#fdf1e1; --bad:#c0221b; --bad-soft:#fdeceb;
  --f:"Lato","Helvetica Neue",Arial,sans-serif;
  --nav:84px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}

/* global nav */
.gnav{position:fixed;left:0;top:0;bottom:0;width:var(--nav);background:var(--brand);display:flex;flex-direction:column;align-items:stretch;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:env(safe-area-inset-left,0px);z-index:10}
.gnav-brand{color:#fff;font-weight:900;font-size:13px;letter-spacing:.06em;text-align:center;line-height:1.15;padding:6px 0 16px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:6px}
.gnav-item{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:0;color:#fff;font-size:12px;padding:12px 4px;cursor:pointer;opacity:.92}
.gnav-item svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gnav-item:hover{background:rgba(255,255,255,.08);opacity:1}
.gnav-item[aria-selected="true"]{background:#fff;color:var(--brand);opacity:1}
.shell{margin-left:var(--nav);min-height:100vh;display:flex;flex-direction:column}
.crumbbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--page);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;min-height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px;min-width:0}
.crumbs button{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer}
.crumbs button:hover{text-decoration:underline}
.crumbs .sep{color:var(--muted)}
.crumbs .here{color:var(--ink)}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.content{flex:1;width:100%;max-width:1240px;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:760px){
  .gnav{top:auto;width:auto;right:0;height:auto;flex-direction:row;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);border-top:1px solid var(--brand-dark)}
  .gnav-brand{display:none}
  .gnav-item{flex:1;font-size:11px;padding:8px 2px 9px}
  .gnav-item svg{width:22px;height:22px}
  .shell{margin-left:0;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .crumbbar{min-height:50px}
  .crumbs{font-size:14.5px}
}

/* common */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:28px;font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:18px;font-weight:700;margin:0 0 10px}
h3{font-size:16px;font-weight:700;margin:0}
.lead{color:var(--muted);margin:-10px 0 18px}
input,select{font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
input:focus,select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 2px var(--brand-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;min-width:0}
label.f input,label.f select{width:100%;font-weight:400}
.btn{font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#ebeced}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.danger{color:var(--bad);background:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;font:inherit;color:var(--link);cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.msg{font-size:13px;min-height:1em;margin-top:8px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.none{background:var(--soft);color:var(--muted)}
.box{border:1px solid var(--line-soft);border-radius:6px;padding:16px;background:#fff}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:700;text-align:right}

/* dashboard */
.semsel{display:flex;gap:10px;flex-wrap:wrap}
.semsel label{flex-direction:row;align-items:center;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.ccard{border:1px solid var(--line-soft);border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.08);display:flex;flex-direction:column}
.ccard-top{position:relative;height:118px;border:0;padding:0;cursor:pointer;background:var(--c,#8b1a24);display:block;width:100%}
.ccard-top:hover{filter:brightness(1.07)}
.ccard-grade{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;font-size:15px;border-radius:4px;padding:4px 9px}
.ccard-grade.empty{font-weight:700;font-size:12px;color:var(--muted)}
.ccard-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ccard-title{font-size:15px;font-weight:700;color:var(--link)}
.ccard-meta{font-size:13px;color:var(--muted)}
.ccard-row{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;font-size:13px}
.ccard-row select{flex:1}
.hint{align-self:flex-start;background:var(--brand-soft);color:var(--brand);border:0;border-radius:4px;font-size:12.5px;font-weight:700;padding:4px 8px;cursor:pointer}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.todo li{display:flex;gap:8px;align-items:flex-start}
.todo li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px;flex:0 0 auto}

/* grades */
.gtable-wrap{overflow-x:auto;border-top:1px solid var(--line)}
table.gt{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
table.gt th,table.gt td{padding:9px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle}
table.gt thead th{font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
table.gt .num{text-align:right;width:92px}
table.gt .per{width:118px}
table.gt .x{width:40px;text-align:center}
table.gt td input,table.gt td select{border-color:transparent;background:transparent;width:100%;padding:6px 7px}
table.gt td input:hover,table.gt td select:hover{border-color:var(--line)}
table.gt td input:focus,table.gt td select:focus{border-color:var(--brand);background:#fff}
table.gt td.num input{text-align:right}
table.gt tr.grp th{background:var(--soft);font-size:15px;padding-block:11px;border-bottom:1px solid var(--line)}
.grp-row{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.grp-stats{font-weight:400;font-size:13px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center}
.grp-stats b{color:var(--ink)}
.grp-row .link{margin-left:auto;font-size:13px;font-weight:400}
tr.exrow td:first-child{font-weight:700}
tr.exrow td{background:#fcfcfc}
tr.addrow td{padding-block:8px}
.rm{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:4px}
.rm:hover{color:var(--bad);background:var(--bad-soft)}
.sum-terms{display:flex;flex-direction:column}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.sum-row b{font-size:16px}
.sum-row small{color:var(--muted);margin-left:6px;font-weight:400}
.sum-final{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.sum-final span{font-weight:700}
.sum-final b{font-size:30px;font-weight:900;color:var(--brand)}
.ladder{width:100%;border-collapse:collapse;font-size:14px}
.ladder th{font-weight:700;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.ladder td{padding:6px 4px;border-bottom:1px solid var(--line-soft)}
.ladder td:last-child,.ladder th:last-child{text-align:right}
.ladder tr.cur td{background:var(--brand-soft);font-weight:700;color:var(--brand)}
details.box>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.box>summary::after{content:"+";font-weight:400;color:var(--muted)}
details.box[open]>summary::after{content:"–"}
details.box[open]>summary{margin-bottom:12px}
.adv{display:flex;flex-direction:column;gap:10px}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* gwa */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:900;margin-top:2px;line-height:1.2}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:14px}
.opts label{display:flex;gap:8px;align-items:center}
details.sem{border:1px solid var(--line-soft);border-radius:6px;margin-bottom:12px;background:#fff}
details.sem>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:13px 16px}
details.sem>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.sem[open]>summary::before{transform:rotate(90deg)}
details.sem[open]>summary{border-bottom:1px solid var(--line-soft)}
.sem-name{font-weight:700}
.sem-gwa{margin-left:auto;font-size:14px;color:var(--muted)}
.sem-gwa b{color:var(--ink)}
.ctable{overflow-x:auto}
table.ct{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.ct th,table.ct td{padding:8px 16px;border-bottom:1px solid var(--line-soft);text-align:left}
table.ct th{font-weight:700;font-size:13px;color:var(--muted)}
table.ct td.u{text-align:center;width:60px}
table.ct td.g{width:130px}
table.ct td.g select{width:100%}
table.ct .code{font-weight:700}
table.ct select.elec{display:block;margin-top:6px;width:100%;max-width:340px;font-size:13px}

/* rules + account */
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.rules{grid-template-columns:minmax(0,1fr)}}
.rules p,.rules li{font-size:14.5px;max-width:65ch}
.rules ul{padding-left:18px;margin:8px 0}
table.eq{width:100%;border-collapse:collapse;font-size:14px}
table.eq th{text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
table.eq td{padding:6px 8px;border-bottom:1px solid var(--line-soft)}
.tbl{overflow-x:auto}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--soft);border-radius:4px;padding:10px 12px;overflow-x:auto;white-space:pre}
.acct{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:860px}
@media (max-width:760px){.acct{grid-template-columns:minmax(0,1fr)}}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* sign in */
.auth{min-height:100vh;background:var(--soft);display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line-soft);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
.auth-head{background:var(--brand);color:#fff;padding:22px 24px}
.auth-head h1{font-size:24px;font-weight:900;margin:0}
.auth-head p{margin:4px 0 0;font-size:14px;opacity:.9}
.auth-tabs{display:flex;border-bottom:1px solid var(--line-soft)}
.auth-tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer}
.auth-tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
#authForm{display:flex;flex-direction:column;gap:14px;padding:20px 24px 24px}
#authForm input{padding:10px 11px;font-size:15px}
.auth-err{min-height:1.2em;font-size:13.5px;color:var(--bad)}
.auth-foot{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}
@media (max-width:600px){
  table.gt{min-width:0}
  table.gt .per{display:none}
  table.gt .num{width:72px}
  table.gt th,table.gt td{padding:8px 6px}
  table.gt .x{width:30px}
  .ccard-top{height:64px}
  .grp-row .link{margin-left:0}
}
/* import */
.imp-open-row{margin:-6px 0 14px}
.box.imp{margin-bottom:18px;border-color:var(--line)}
.imp-head{display:flex;justify-content:space-between;align-items:center}
.imp-head h2{margin:0}
#impText{width:100%;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:4px;resize:vertical;min-height:110px}
#impText:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 2px var(--brand-soft)}
.imp-actions{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-top:10px}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:14px;display:flex}
label.inline select{width:auto}
.imp-table{margin-top:6px}
.imp-table td.dest{width:210px}
.imp-table tr.off td{opacity:.45}
.imp-table input[type=checkbox]{width:auto}
@media (max-width:600px){.imp-table td.dest{width:auto}.imp-table{min-width:520px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="auth" id="auth" hidden>
  <div>
    <div class="auth-card">
      <div class="auth-head"><h1>HAU SOC Grader</h1><p>Course grades and GWA for School of Computing students</p></div>
      <div class="auth-tabs" role="tablist">
        <button type="button" role="tab" id="authLogin" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="authSignup" aria-selected="false">Sign up</button>
      </div>
      <form id="authForm" data-mode="login" novalidate>
        <label class="f signup-only" for="aName" hidden>Full name<input id="aName" name="aName" autocomplete="name" maxlength="80" placeholder="Juan Dela Cruz"></label>
        <label class="f" for="aNo">Student number<input id="aNo" name="aNo" autocomplete="username" maxlength="20" required placeholder="e.g. 20231234"></label>
        <label class="f" for="aPass">Password<input id="aPass" name="aPass" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
        <label class="f signup-only" for="aPass2" hidden>Confirm password<input id="aPass2" name="aPass2" type="password" autocomplete="new-password" minlength="8" maxlength="128"></label>
        <div class="auth-err" id="authErr" role="alert"></div>
        <button class="btn primary" id="authSubmit" type="submit">Log in</button>
        <p class="note signup-only" hidden>Use at least 8 characters for your password.</p>
      </form>
    </div>
    <p class="auth-foot">Student-made tool. Not an official HAU system.</p>
  </div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="impFile" accept="image/*" multiple hidden>
<div class="app" id="app" hidden>
  <nav class="gnav" role="tablist" aria-label="Main">
    <div class="gnav-brand">HAU<br>SOC</div>
    <button class="gnav-item" role="tab" id="tab-acct" data-act="tab" data-t="acct"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Account</button>
    <button class="gnav-item" role="tab" id="tab-mine" data-act="tab" data-t="mine"><svg viewBox="0 0 24 24"><path d="M3.5 15a8.5 8.5 0 1 1 17 0"/><path d="M12 15l4-5"/><circle cx="12" cy="15" r="1.4"/></svg>Dashboard</button>
    <button class="gnav-item" role="tab" id="tab-course" data-act="tab" data-t="course"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Grades</button>
    <button class="gnav-item" role="tab" id="tab-gwa" data-act="tab" data-t="gwa"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>GWA</button>
    <button class="gnav-item" role="tab" id="tab-ref" data-act="tab" data-t="ref"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M9 13h6M9 17h6"/></svg>Rules</button>
  </nav>
  <div class="shell">
    <header class="crumbbar"><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav><span class="sync" id="syncState"></span></header>
    <main class="content" id="root">
      <section class="panel" id="panel-mine"></section>
      <section class="panel" id="panel-course"></section>
      <section class="panel" id="panel-gwa"></section>
      <section class="panel" id="panel-ref"></section>
      <section class="panel" id="panel-acct"></section>
    </main>
  </div>
</div>
<script>
(function(){
/* ---------- data from the handbook & curriculum ---------- */
const SCALE=[[97,1.00,'A','Outstanding'],[94,1.25,'A-','Excellent'],[91,1.50,'B+','Superior'],[88,1.75,'B','Very Good'],[85,2.00,'B-','Good'],[82,2.25,'C+','Satisfactory'],[79,2.50,'C','Fairly Satisfactory'],[76,2.75,'C-','Fair'],[75,3.00,'D','Passed']];
const CUR=[
 {sem:'1st Year · 1st Sem',c:[['2MATHMWORLD','Mathematics in the Modern World',3],['4FYE1','Big History 1: Big Bang to the Future',3],['6CFUN','Computing Fundamentals',3],['6LOGPROG','Logic Formulation and Introductory Programming',3],['7TPE1','PATHFit 1: Movement Competency Training',2],['9STS','Science, Technology and Society',3],['THEOLOGY101','Theological Foundations',3],['CWTS1','Civic Welfare Training Services 1',3,1]]},

const KEY_BASE='hau-grade-calc-v1';
function blankPeriod(mode){return {mode:mode||'itemized',cs:'',ex:'',items:[{n:'',s:'',m:''}],lec:{s:'',m:''},lab:{s:'',m:''},method:'raw',lecW:'50'}}
function blankSubject(){return {id:'s'+Date.now()+Math.floor(Math.random()*1e4),code:'',name:'New subject',csW:'65',exW:'35',pass:'50',round:'trunc',periods:[blankPeriod(),blankPeriod(),blankPeriod()]}}
let KEY=KEY_BASE,S=null,API=false,USER=null,syncTimer=null;
function readLocal(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function normalize(raw){
  let s=raw&&typeof raw==='object'?raw:{};
  if(!Array.isArray(s.subjects))s.subjects=[];
  s.year=s.year||3;s.sem=s.sem||1;if(!['mine','course','gwa','ref','acct'].includes(s.tab))s.tab='mine';
  if(!s.v||s.v<2)s.tab='mine';s.v=3;
  s.gwa=s.gwa||{};s.gwa.grades=s.gwa.grades||{};s.gwa.elect=s.gwa.elect||{};s.gwa.nstp=!!s.gwa.nstp;
  if(!s.subjects.length){const c=CUR[(s.year-1)*2+(s.sem-1)].c[0];const x=blankSubject();x.code=c[0];x.name=c[1];s.subjects.push(x)}
  if(!s.subjects.some(x=>x.id===s.cur))s.cur=s.subjects[0].id;
  return s;
}
function setSync(t){const el=document.getElementById('syncState');if(el)el.textContent=t}
function save(){

async function pushData(){

}
function sub(){return S.subjects.find(x=>x.id===S.cur)||S.subjects[0]}

/* ---------- math ---------- */
function num(v){if(v===''||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null}
function f2(n){return n==null?'—':(Math.round(n*100)/100).toFixed(2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function eqGrade(t){for(const r of SCALE)if(t>=r[0])return r[1];return 5}
function transmute(c,P){return 75+(c-P)*25/(100-P)}
function settle(t,mode){return mode==='round'?Math.round(t):Math.floor(t+1e-9)}
function gradeText(g){return g==null?'—':g.toFixed(2)}
function examPct(p){
  const ls=num(p.lec.s),lm=num(p.lec.m),bs=num(p.lab.s),bm=num(p.lab.m);
  const L=ls!=null&&lm>0,B=bs!=null&&bm>0;
  if(L&&B){if(p.method==='raw')return (ls+bs)/(lm+bm);if(p.method==='avg')return (ls/lm+bs/bm)/2;const w=Math.min(100,Math.max(0,num(p.lecW)??50))/100;return ls/lm*w+bs/bm*(1-w)}
  if(L)return ls/lm;if(B)return bs/bm;return null;
}
function period(s,p){
  const cw=num(s.csW)??65,ew=num(s.exW)??35,W=cw+ew;let cs=null,ex=null,csRaw=null;
  if(p.mode==='quick'){cs=num(p.cs);ex=num(p.ex)}
  else{let a=0,b=0;for(const it of p.items){const x=num(it.s),y=num(it.m);if(x!=null&&y>0){a+=x;b+=y}}
    if(b>0){cs=a/b*cw;csRaw=[a,b]}const e=examPct(p);if(e!=null)ex=e*ew}
  const term=(cs!=null&&ex!=null&&W>0)?(cs+ex)/W*100:null;
  return {cs,ex,term,cw,ew,W,csRaw};
}
function compute(s){
  const P=num(s.pass)??50;const per=s.periods.map(p=>period(s,p));const out=[];let sum=0,ok=true;
  per.forEach((r,i)=>{if(r.term==null)ok=false;else sum+=r.term;
    const cum=ok?sum/(i+1):null;const t=cum!=null?transmute(cum,P):null;
    out.push(Object.assign({},r,{cum,tr:t,grade:t!=null?eqGrade(settle(t,s.round)):null}))});
  return out;
}

function rowsOf(sem){return sem.c.map(([code,title,units,nstp])=>({code,title,units,nstp:!!nstp}))}
function gwaCalc(rows){
  let s=0,u=0,worst=0,fails=0,missing=0,earned=0,graded=0;
  rows.forEach(r=>{const g=S.gwa.grades[r.code];if(!g||g==='INC'){missing++;return}const v=+g;graded++;
    if(v<=3)earned+=r.units;if(v===9)return;if(v>=5)fails++;
    if(r.nstp&&!S.gwa.nstp)return;
    const e=v>=5?5:v;s+=e*r.units;u+=r.units;if(!r.nstp)worst=Math.max(worst,v)});
  return {gwa:u?s/u:null,units:u,worst,fails,missing,earned,graded};
}
function semStatus(c,total){
  if(c.gwa==null)return '<span class="chip none">no grades yet</span>';
  if(c.fails)return `<span class="chip bad">${c.fails} failing</span>`;
  const partial=c.missing>0;let h=null;
  if(c.worst<=2&&c.gwa<=1.25)h="President's List";else if(c.worst<=2&&c.gwa<=1.75)h="Dean's List";
  if(h)return `<span class="chip good">${partial?'on track: ':''}${h}</span>`;
  if(c.worst>2&&c.gwa<=1.75)return '<span class="chip warn">a grade below 2.00 blocks honors</span>';
  return '<span class="chip none">no honors</span>';
}

function semIdx(){return (S.year-1)*2+(S.sem-1)}
function semLabel(){return YEARS[S.year-1]+' · '+SEMS[S.sem-1]}
function semSubjects(){

    if(/^ELECTIVE/.test(code)){const ch=S.gwa.elect[code];if(!ch)return {code,title,units,slot:code,pending:true};const e=ELECT.find(x=>x[0]===ch);return {code:ch,title:e?e[1]:title,units,slot:code}}
    return {code,title,units,slot:code};
  });
}
function findSubject(code){return S.subjects.find(q=>(q.code||'').toUpperCase()===code)}
function openSubject(code,name){
  let x=findSubject(code);
  if(!x){x=blankSubject();x.code=code;x.name=name;S.subjects.push(x)}
  S.cur=x.id;return x;
}
function calcGradeFor(code){const x=findSubject(code);if(!x)return null;return compute(x)[2].grade}

function updateCourse(){
  const s=sub();const R=compute(s);const P=num(s.pass)??50;
  R.forEach((r,i)=>{
    const el=document.getElementById('o'+i);if(!el)return;
    const g=r.grade;const cls=g==null?'none':g<=1.75?'good':g<=3?'':'bad';
    el.innerHTML=`<span>Class standing <b>${f2(r.cs)}</b>/${f2(r.cw)}</span><span>Exam <b>${f2(r.ex)}</b>/${f2(r.ew)}</span><span class="chip ${cls}">${g==null?'incomplete':gradeText(g)}</span>`;
  });

const IMP={open:false,text:'',rows:[],def:2,mode:'add',status:''};
const META_RESET=/^(based on graded|past assignments|upcoming assignments|grades for|name\s+due|assignments are weighted|group\s+weight|total\b)/i;
const META=/^(closed for submission|clased for|no due date|due\b|graded$|missing$|submitted$|late$|not submitted$|imported assignments$|assignments$|discussions$|chapter exams$|individual assignments$|practice exams$|quizzes$|skills exams$|special projects$|course completion$|final exam$|dashboard|calendar|to-?do|notifications|inbox|show (all|saved)|print grades|arrange by|course\b|what-if|information assurance and security$)/i;
const DATE=/^(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.? \d{1,2}\b/i;
const SCORE=/(^|[^\w.])(-|–|—|\d{1,4}(?:[.,]\d+)?)\s*[\/]\s*(\d{1,3}(?:,\d{3})*(?:\.\d+)?)(?![\d.])/;
function cleanLine(l){
  l=l.replace(/[\t ]+/g,' ').trim();
  l=l.replace(/^[^A-Za-z0-9(#\/\-–—]+/,'');
  const m=l.match(/^(\S{1,2}) (.+)$/);
  if(m&&!/^\d+$/.test(m[1])&&!/[\/\-–—]/.test(m[1])&&(/[^A-Za-z0-9#]/.test(m[1])||/^[a-z]/.test(m[1])||/[a-z][A-Z]|[A-Z][a-z]/.test(m[1])&&m[1].length===2))l=m[2];
  return l.trim();
}
function parseScores(text){
  const out=[];let buf=[];
  for(const raw of String(text).split(/\r?\n/)){
    const l=cleanLine(raw);if(!l)continue;
    if(META_RESET.test(l)){buf=[];continue}
    if(/^\d{1,2}:\d{2}\b/.test(l)||/^<\s*grades/i.test(l))continue;
    let m=l.match(SCORE);
    if(!m){const z=l.match(/^\/\s*(\d{1,4})\b/);if(z)m=Object.assign([z[0],'','-',z[1]],{index:0})}
    if(m&&!/%/.test(l)){
      const s=m[2],max=parseFloat(m[3].replace(/,/g,''));
      const before=l.slice(0,m.index+m[1].length).replace(/(^|\s+)(imported assignments|assignments|quizzes|discussions|chapter exams|individual assignments)\b.*$/i,'').trim();
      let name='';
      if(/[A-Za-z]{3}/.test(before)&&!DATE.test(before)&&!META.test(before))name=before;
      else if(buf.length)name=buf.slice(-3).join(' ');
      buf=[];
      if(!name||!(max>0))continue;
      out.push({name:name.replace(/\s+/g,' ').trim(),s:/^[-–—]$/.test(s)?'':s.replace(',','.'),m:String(max)});
      continue;
    }
    if(META.test(l)||DATE.test(l))continue;
    if(/%/.test(l))continue;
    if(!/[A-Za-z]{3}/.test(l))continue;
    buf.push(l);if(buf.length>4)buf.shift();
  }
  const seen=new Map();
  for(const r of out){const k=r.name.toLowerCase().replace(/[^a-z0-9]/g,'');const p=seen.get(k);if(!p||(p.s===''&&r.s!==''))seen.set(k,r)}
  return [...seen.values()];
}
function classify(name,def){
  const n=name.toLowerCase();let per=def;
  if(/prelim/.test(n))per=0;else if(/mid/.test(n))per=1;else if(/final/.test(n))per=2;
  const isExam=/\bexam/.test(n)&&/(prelim|mid|final)/.test(n)&&!/badge|chapter/.test(n);
  return {per,kind:isExam?(/\blab/.test(n)?'lab':'lec'):'item'};
}

  const s=sub();const rows=IMP.rows.filter(r=>r.on&&r.name&&num(r.m)>0);if(!rows.length)return;
  const touched=new Set(),quick=new Set();
  if(IMP.mode==='replace')rows.forEach(r=>{const [k,p]=r.dest.split('-');if(k==='item')s.periods[+p].items=[]});
  rows.forEach(r=>{const [k,ps]=r.dest.split('-');const p=s.periods[+ps];touched.add(+ps);if(p.mode==='quick')quick.add(+ps);
    if(k==='item'){p.items=p.items.filter(it=>it.n||it.s||it.m);p.items.push({n:r.name,s:r.s,m:r.m})}
    else p[k]={s:r.s,m:r.m};});
  s.periods.forEach(p=>{if(!p.items.length)p.items.push({n:'',s:'',m:''})});
  save();
  const names=[...touched].sort().map(i=>PNAMES[i]).join(', ');
  IMP.rows=[];IMP.text='';
  IMP.status=`Added ${rows.length} score${rows.length===1?'':'s'} to ${names}.`+(quick.size?` ${[...quick].map(i=>PNAMES[i]).join(' and ')} still use${quick.size===1?'s':''} ERP points. Tap "Enter item scores instead" there to use the imported items.`:'');
  renderCourse();
}
/* OCR for screenshots (runs in the browser; files are bundled in vendor/ocr) */
let ocrWorker=null;
async function getOcr(){
  if(ocrWorker)return ocrWorker;
  if(!window.Tesseract)await loadScript('vendor/ocr/tesseract.min.js');
  const base=new URL('vendor/ocr/',location.href).href;
  ocrWorker=await window.Tesseract.createWorker('eng',1,{workerPath:base+'worker.min.js',corePath:base+'core',langPath:base+'lang',gzip:true,
    logger:m=>{if(m.status==='recognizing text')setImpStatus(`${OCR_LABEL} ${Math.round(m.progress*100)}%`)}});
  return ocrWorker;
}
let OCR_LABEL='Reading…';
async function prepImage(file){
  let src;try{src=await createImageBitmap(file)}catch(e){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
  const w=src.width,h=src.height;const k=Math.max(1,Math.min(2,1800/w));
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext('2d');x.drawImage(src,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),a=d.data;let sum=0;
  for(let i=0;i<a.length;i+=4){const g=.299*a[i]+.587*a[i+1]+.114*a[i+2];a[i]=a[i+1]=a[i+2]=g;sum+=g}
  if(sum/(a.length/4)<110)for(let i=0;i<a.length;i+=4){a[i]=a[i+1]=a[i+2]=255-a[i]}
  x.putImageData(d,0,0);return c;
}
async function ocrFiles(files){
  if(!files.length)return;
  const ta=document.getElementById('impText');if(ta)IMP.text=ta.value;
  try{
    setImpStatus('Loading the text reader… (first time takes a few seconds)');
    const w=await getOcr();
    for(let i=0;i<files.length;i++){
      OCR_LABEL=`Reading screenshot ${i+1} of ${files.length}…`;setImpStatus(OCR_LABEL);
      const {data}=await w.recognize(await prepImage(files[i]));
      IMP.text=(IMP.text?IMP.text.replace(/\s*$/,'\n\n'):'')+data.text.trim();
    }
    readImport();
  }catch(e){console.error(e);setImpStatus("Couldn't read the screenshot here. Paste the text instead, or try again on the website.")}
}

/* ---------- wiring ---------- */
const PANELS=['mine','course','gwa','ref','acct'];
function setTab(t){if(!PANELS.includes(t))t='mine';S.tab=t;PANELS.forEach(x=>{document.getElementById('panel-'+x).hidden=x!==t;document.getElementById('tab-'+x).setAttribute('aria-selected',x===t)});renderCrumbs();save()}
function setPath(path,val){
  const s=sub();const parts=path.split('.');let o;
  if(parts[0]==='sub'){s[parts[1]]=val;return}
  o=s.periods;parts.shift();
  for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;
}
function renderAll(){renderMine();renderCourse();renderGWA();renderRef();renderAcct()}
const root=document.body;
function onField(e){
  const el=e.target;const ch=e.type==='change';
  if(el.id==='subSel'){if(!ch)return;const v=el.value;
    if(v.startsWith('c:')){const code=v.slice(2);const it=semSubjects().find(x=>x.code===code);openSubject(code,it?it.title:code)}else S.cur=v.slice(3);
    save();renderCourse();renderCrumbs();return}
  if(el.id==='selYear'||el.id==='selSem'){if(!ch)return;S[el.id==='selYear'?'year':'sem']=+el.value;save();renderMine();renderCourse();renderGWA();return}
  if(el.dataset.move){if(!ch)return;const [i,j]=el.dataset.move.split('.').map(Number);const to=+el.value;const s=sub();
    const it=s.periods[i].items.splice(j,1)[0];if(!s.periods[i].items.length)s.periods[i].items.push({n:'',s:'',m:''});
    const tp=s.periods[to];if(tp.items.length===1&&!tp.items[0].n&&!tp.items[0].s&&!tp.items[0].m)tp.items=[];tp.items.push(it);
    save();renderCourse();return}
  if(el.dataset.adv){const s=sub();s.periods.forEach(p=>p[el.dataset.adv]=el.value);save();const wl=document.getElementById('advLecWl');if(wl)wl.hidden=s.periods[2].method!=='w';updateCourse();return}
  if(el.dataset.k){setPath(el.dataset.k,el.value);save();
    if(['sub.csW','sub.exW'].includes(el.dataset.k)&&ch){renderCourse();return}
    if(el.dataset.k==='sub.code'||el.dataset.k==='sub.name')renderCrumbs();
    updateCourse();return}
  const g=el.dataset.g;if(!g)return;
  if(g==='nstp')S.gwa.nstp=el.checked;
  else if(g.startsWith('g.')){const c=g.slice(2);if(el.value)S.gwa.grades[c]=el.value;else delete S.gwa.grades[c]}
  else if(g.startsWith('e.'))S.gwa.elect[g.slice(2)]=el.value;
  save();
  if(ch){const inGwa=!!el.closest('#panel-gwa');renderMine();
    if(inGwa&&!g.startsWith('e.'))updateGWA();else renderGWA();
    if(g.startsWith('e.'))renderCourse();}
}
root.addEventListener('input',onField);
root.addEventListener('input',e=>{const el=e.target;
  if(el.id==='impText'){IMP.text=el.value;return}
  if(el.id==='impDef'){IMP.def=+el.value;return}
  if(el.name==='impMode'){IMP.mode=el.value;return}
  const d=el.dataset&&el.dataset.imp;if(!d)return;const [j,f]=d.split('.');const r=IMP.rows[+j];if(!r)return;
  r[f]=f==='on'?el.checked:el.value;
  if(f==='on'){el.closest('tr').classList.toggle('off',!el.checked);const n=IMP.rows.filter(x=>x.on).length;const b=document.getElementById('impApply');if(b){b.disabled=!n;b.textContent=`Add ${n} score${n===1?'':'s'}`}}
});
root.addEventListener('change',e=>{const el=e.target;if(el.name==='impMode')IMP.mode=el.value;if(el.id==='impDef')IMP.def=+el.value});
document.getElementById('impFile').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';ocrFiles(f)});
document.addEventListener('paste',e=>{if(!IMP.open||S.tab!=='course')return;const f=[...(e.clipboardData&&e.clipboardData.files||[])].filter(x=>/^image\//.test(x.type));if(f.length){e.preventDefault();ocrFiles(f)}});
root.addEventListener('change',onField);
let delArm=0,clrArm=0;
function arm(b,label,ts){if(Date.now()-ts>3000){const t=b.textContent;b.textContent=label;setTimeout(()=>{if(b.isConnected)b.textContent=t},3000);return Date.now()}return 0}
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const s=sub();
  if(a==='tab'){setTab(b.dataset.t);window.scrollTo(0,0);return}
  if(a==='open-sub'){
    if(b.dataset.pending){const sel=document.getElementById('el-m-'+b.dataset.code);if(sel)sel.focus();document.getElementById('mineMsg').textContent='Choose which IT elective you are taking first.';return}
    openSubject(b.dataset.code,b.dataset.name);save();renderCourse();setTab('course');window.scrollTo(0,0);return}
  if(a==='use'){S.gwa.grades[b.dataset.code]=b.dataset.g;save();renderMine();renderGWA();return}
  if(a==='mode'){s.periods[+b.dataset.i].mode=b.dataset.m;save();renderCourse();return}
  if(a==='add-item'){const i=+b.dataset.i;const p=s.periods[i];p.items.push({n:'',s:'',m:''});save();renderCourse();const el=document.getElementById('i'+i+'n'+(p.items.length-1));if(el)el.focus();return}
  if(a==='del-item'){const p=s.periods[+b.dataset.i];p.items.splice(+b.dataset.j,1);if(!p.items.length)p.items.push({n:'',s:'',m:''});save();renderCourse();return}
  if(a==='add-sub'){const n=blankSubject();n.name='Custom subject';S.subjects.push(n);S.cur=n.id;save();renderCourse();renderCrumbs();const c=document.getElementById('sCode');if(c){c.closest('details').open=true;c.focus()}return}
  if(a==='del-sub'){const t=arm(b,'Click again to clear all scores',delArm);if(t){delArm=t;return}delArm=0;s.periods=[blankPeriod(),blankPeriod(),blankPeriod()];save();renderCourse();return}
  if(a==='clear-gwa'){const t=arm(b,'Click again to clear',clrArm);if(t){clrArm=t;return}clrArm=0;S.gwa.grades={};save();renderGWA();renderMine();return}
  if(a==='send'){
    const g=compute(s)[2].grade;const m=document.getElementById('sendMsg');
    if(g==null){m.textContent='Finish all three periods first.';return}
    const code=(s.code||'').trim().toUpperCase();let slot=null;
    CUR.forEach(sem=>sem.c.forEach(c=>{if(c[0]===code)slot=c[0]}));
    if(!slot)Object.keys(S.gwa.elect).forEach(k=>{if(S.gwa.elect[k]===code)slot=k});
    if(!slot&&ELECT.some(x=>x[0]===code)){const free=['ELECTIVE1','ELECTIVE2','ELECTIVE3','ELECTIVE4'].find(k=>!S.gwa.elect[k]);if(free){S.gwa.elect[free]=code;slot=free}}
    if(!slot){m.textContent=code?`${code} isn't in the BSIT Web Dev curriculum. Check the course code in Settings.`:'Add a course code in Settings first.';return}
    S.gwa.grades[slot]=g.toFixed(2);save();renderMine();renderGWA();m.textContent=`Saved ${g.toFixed(2)} as your ${code} final grade.`;return}
  if(a==='logout'){clearTimeout(syncTimer);(async()=>{try{await pushData()}catch(x){}try{await fetch('api/logout',{method:'POST',credentials:'same-origin'})}catch(x){}location.reload()})();return}
  if(a==='export'){const blob=new Blob([JSON.stringify({app:'hau-soc-grader',version:1,data:S},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='hau-soc-grader-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return}
  if(a==='import'){document.getElementById('importFile').click();return}
  if(a==='imp-open'){IMP.open=true;renderImport();const t=document.getElementById('impText');if(t)t.focus();return}
  if(a==='imp-close'){IMP.open=false;renderImport();return}
  if(a==='imp-upload'){const t=document.getElementById('impText');if(t)IMP.text=t.value;document.getElementById('impFile').click();return}
  if(a==='imp-read'){readImport();return}
  if(a==='imp-apply'){applyImport();return}
  if(a==='pdf-course'||a==='pdf-gwa'){const t=b.textContent;b.disabled=true;b.textContent='Preparing PDF…';
    (a==='pdf-course'?pdfCourse():pdfGWA()).catch(()=>{const m=document.getElementById(a==='pdf-course'?'sendMsg':'gwaMsg');if(m)m.textContent="Couldn't create the PDF. Check your connection and try again."}).finally(()=>{b.disabled=false;b.textContent=t});return}
});
document.getElementById('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const d=j&&j.data?j.data:j;if(!d||!Array.isArray(d.subjects))throw 0;
    S=normalize(d);save();renderAll();setTab('acct');
    document.getElementById('backupMsg').textContent=`Imported ${S.subjects.length} subject${S.subjects.length===1?'':'s'}.`}
  catch(x){const m=document.getElementById('backupMsg');if(m)m.textContent="That file isn't a HAU SOC Grader backup."}
  e.target.value='';
});

/* ---------- accounts ---------- */
function start(){
  document.getElementById('auth').hidden=true;document.getElementById('app').hidden=false;
  renderAll();setTab(S.tab||'mine');
  if(!API)setSync('Saved on this device');
}
async function loadAccount(){
  KEY=KEY_BASE+':'+USER.studentNumber.toUpperCase();
  let data=null;
  try{const r=await fetch('api/data',{credentials:'same-origin'});if(r.ok)data=(await r.json()).data}catch(e){}
  if(!data){const cached=readLocal(KEY)||readLocal(KEY_BASE);S=normalize(cached);start();if(cached)pushData();return}
  S=normalize(data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  start();setSync('Saved to your account');
}
function showAuth(mode){document.getElementById('app').hidden=true;document.getElementById('auth').hidden=false;setAuthMode(mode||'login')}
function setAuthMode(m){
  const f=document.getElementById('authForm');f.dataset.mode=m;
  document.getElementById('authLogin').setAttribute('aria-selected',m==='login');
  document.getElementById('authSignup').setAttribute('aria-selected',m==='signup');
  document.querySelectorAll('.signup-only').forEach(el=>el.hidden=m!=='signup');
  document.getElementById('aName').required=m==='signup';document.getElementById('aPass2').required=m==='signup';
  document.getElementById('aPass').autocomplete=m==='signup'?'new-password':'current-password';
  document.getElementById('authSubmit').textContent=m==='signup'?'Create account':'Log in';
  document.getElementById('authErr').textContent='';
}
document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,m=f.dataset.mode,err=document.getElementById('authErr');
  const body={studentNumber:f.aNo.value.trim(),password:f.aPass.value};
  if(m==='signup'){body.name=f.aName.value.trim();if(f.aPass.value!==f.aPass2.value){err.textContent='Passwords do not match.';return}}
  const btn=document.getElementById('authSubmit');btn.disabled=true;err.textContent='';
  try{const r=await fetch(m==='signup'?'api/signup':'api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=j.error||'Something went wrong. Try again.';return}
    USER=j.user;f.reset();await loadAccount();
  }catch(x){err.textContent='Cannot reach the server. Check your connection.'}
  finally{btn.disabled=false}
});
document.getElementById('authLogin').addEventListener('click',()=>setAuthMode('login'));
document.getElementById('authSignup').addEventListener('click',()=>setAuthMode('signup'));
async function boot(){
  try{
    const r=await fetch('api/me',{credentials:'same-origin'});
    if(!(r.headers.get('content-type')||'').includes('application/json'))throw new Error('no api');
    API=true;
    if(r.ok){USER=(await r.json()).user;await loadAccount()}else showAuth('login');
  }catch(e){API=false;S=normalize(readLocal(KEY_BASE));start()}
}
boot();
})();
