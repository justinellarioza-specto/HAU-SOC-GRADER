<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAU Grade &amp; GWA Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: HAU student-portal shell in white and red glass — red frosted sidebar on the left, frosted white record cards floating over a soft white ground with blurred red light; sidebar becomes a top bar on phones. Single light look by design. */
:root{
  --bg:#fbf8f8; --surface:rgba(255,255,255,.55); --solid:#ffffff; --zebra:rgba(176,30,34,.045); --field:rgba(255,255,255,.75);
  --ink:#2a1d1f; --muted:#7a6a6c; --line:rgba(120,30,34,.12); --glass-edge:rgba(255,255,255,.75);
  --accent:#b01e22; --accent-soft:rgba(176,30,34,.10);
  --side1:rgba(196,32,36,.92); --side2:rgba(112,12,16,.94); --side-ink:#ffffff; --gold:#f2d39a;
  --good:#23794a; --good-soft:rgba(35,121,74,.12); --warn:#9a5b00; --warn-soft:rgba(154,91,0,.12); --bad:#b0281f; --bad-soft:rgba(176,40,31,.12);
  --shadow:0 12px 32px rgba(140,20,24,.10),0 2px 6px rgba(140,20,24,.05);
  --f:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55}
button,input,select{font-family:var(--f)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:calc(100vh - 40px);display:flex;flex-direction:column;gap:22px;
  background:linear-gradient(180deg,var(--side1) 0%,var(--side2) 100%);color:var(--side-ink);
  border-radius:0 0 22px 0;padding:30px 0 24px max(18px,env(safe-area-inset-left,0px));box-shadow:6px 0 24px rgba(60,10,10,.25)}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;padding-right:18px}
.seal{width:92px;height:92px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.seal svg{width:62px;height:62px}
.brand-name{font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.9;width:100%;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.35);text-align:left}
.nav{display:flex;flex-direction:column;gap:12px;flex:1;overflow-y:auto;padding-bottom:6px}
.nav-item{display:block;width:calc(100% - 18px);text-align:left;font-weight:600;font-size:13px;color:var(--side-ink);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:0;border-radius:12px;padding:13px 16px;cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);opacity:.82;transition:opacity .15s}
.nav-item:hover{opacity:1}
.nav-item[aria-selected="true"]{opacity:1;font-weight:700}
.nav-item.pill{background:#fff;color:#5a0b0e;width:100%;border-radius:14px 0 0 14px;box-shadow:none;opacity:1}
.subnav{display:flex;flex-direction:column;gap:6px;margin-top:-4px}
.subnav[hidden]{display:none!important}
.sub-item{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--side-ink);font-weight:500;font-size:12.5px;padding:10px 14px 10px 32px;border-radius:14px 0 0 14px;cursor:pointer;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-item:hover{opacity:1}
.sub-item.on{background:#fff;color:#5a0b0e;font-weight:600;opacity:1}
.side-foot{font-size:11.5px;opacity:.7;padding-right:18px}

.main{min-width:0;padding-block:38px 40px;padding-left:max(16px,min(44px,4vw));padding-right:max(16px,env(safe-area-inset-right,0px),min(44px,4vw))}
.page-title{font-weight:800;font-size:clamp(22px,3vw,28px);color:var(--accent);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 30px;text-wrap:balance}
.quote{text-align:center;color:var(--muted);font-style:italic;font-size:13px;margin:48px auto 0;max-width:60ch}
.quote span{display:block;font-style:normal;text-align:right;max-width:44ch;margin:2px auto 0}
.panel[hidden]{display:none!important}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-radius:0 0 22px 22px;padding:18px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));gap:14px}
  .brand{flex-direction:row;padding-right:0}
  .seal{width:54px;height:54px;border-width:2px}.seal svg{width:38px;height:38px}
  .brand-name{border-bottom:0;padding:0}
  .nav{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px}
  .nav-item,.nav-item.pill{width:auto;white-space:nowrap;border-radius:999px;padding:10px 16px;flex:0 0 auto}
  .subnav,.side-foot{display:none!important}
  .main{padding-block:24px 32px}
}

/* cards */
.card,.period,.sem{background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.card{padding:20px 22px}
.card-title,.card h2,.card h3,.period h3,.sem h3{font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--ink)}
.card>h2:first-child,.card>h3:first-child{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
h2,h3{margin:0}

/* controls */
input,select{font-size:13.5px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono);font-size:13px;text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus,select:focus{border-color:var(--accent)}
.btn{font-weight:600;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(180deg,var(--side1),var(--side2));border-color:transparent;color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--bad)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* course */
.course{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:1100px){.course{grid-template-columns:minmax(0,1fr)}}
.setup{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.subjrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.subjrow label{flex:1 1 220px}
.subjectbar{display:grid;grid-template-columns:1.1fr 100px 2fr;gap:12px;align-items:start}
.settings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:600px){.subjectbar{grid-template-columns:1fr 1fr}.subjectbar .wide{grid-column:1/-1}.settings{grid-template-columns:1fr 1fr}}
.periods{display:flex;flex-direction:column;gap:20px}
.period{overflow:hidden}
.period>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 22px 12px;margin:0 22px 0 0;flex-wrap:wrap}
.period>header{margin:0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--zebra);border-radius:999px;padding:3px}
.seg button{font-weight:600;font-size:11.5px;background:transparent;color:var(--muted);border:0;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pbody{padding:16px 22px;display:flex;flex-direction:column;gap:16px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.quick{grid-template-columns:1fr}}
.unit{display:flex;align-items:center;gap:6px}
.unit span{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.sublabel{font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.items{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 30px;gap:6px;align-items:center}
.irow.head{font-size:10.5px;color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--zebra);border-radius:8px;padding:7px 0 7px 10px}
.irow.head span:nth-child(2),.irow.head span:nth-child(3){text-align:right;padding-right:10px}
.exam{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.exam .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.exam .pair span{color:var(--muted)}
.exam .method{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:12px}
@media (max-width:520px){.exam{grid-template-columns:1fr}.exam .method{grid-template-columns:1fr}}
.pres{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:13px 22px;background:var(--zebra);font-size:12.5px;color:var(--muted)}
.pres b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.pres .chip{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-mono);padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.none{background:var(--zebra);color:var(--muted)}

.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;gap:20px}
@media (max-width:1100px){.rail{position:static}}
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.term{background:var(--zebra);border-radius:12px;padding:12px 8px;text-align:center}
.term .lbl{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.term .g{font-weight:800;font-size:28px;line-height:1.15}
.term .t{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.term.final{background:linear-gradient(180deg,var(--side1),var(--side2));color:#fff}
.term.final .lbl,.term.final .t{color:#fff;opacity:.85}
.ladder,table.eq{width:100%;border-collapse:collapse;font-size:12.5px}
.ladder th,table.eq th{font-size:10.5px;color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 8px;text-align:center;border-bottom:1px solid var(--line)}
.ladder td,table.eq td{padding:8px 8px;text-align:center}
.ladder tbody tr:nth-child(odd) td,table.eq tbody tr:nth-child(odd) td{background:var(--zebra)}
.ladder tr.cur td{background:var(--accent-soft)!important;color:var(--accent);font-weight:700}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.msg{font-size:12px;margin-top:8px;min-height:1em;color:var(--muted)}

/* gwa */
.gwahead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
@media (max-width:760px){.gwahead{grid-template-columns:1fr 1fr}}
.stat .v{font-weight:800;font-size:28px;line-height:1.15;color:var(--accent)}
.stat .k{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:20px;font-size:13px}
.opts label{display:flex;gap:8px;align-items:center}
.opts input{width:auto}
.sems{display:flex;flex-direction:column;gap:22px}
.sem{overflow:hidden;display:flex;flex-direction:column}
.sem>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 22px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ctable{overflow-x:auto}
.crow{display:grid;grid-template-columns:120px minmax(220px,1fr) 64px 110px;gap:10px;align-items:center;padding:9px 22px;min-width:560px}
.crow.head{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-block:11px}
.crow.head span{text-align:center}
.crow.head span:nth-child(2){text-align:center}
.ctable .crow:not(.head):nth-child(even){background:var(--zebra)}
.crow .code{font-size:12px;text-align:center;color:var(--ink)}
.crow .code small{display:block;color:var(--muted);font-size:10px}
.crow .title{font-size:12px;text-transform:uppercase;text-align:center;line-height:1.35}
.crow .u{font-size:12.5px;text-align:center}
.crow select{padding:6px 8px;font-family:var(--f-mono);font-size:12.5px}
.crow select.elec{margin-top:6px;font-family:var(--f);font-size:11.5px;text-transform:none}
.semfoot{margin-top:auto;display:flex;justify-content:space-between;gap:8px;padding:12px 22px;border-top:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}

/* rules */
.ref{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:980px){.ref{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
.ref p,.ref li{font-size:13.5px;max-width:65ch}
.ref ul{padding-left:18px;margin:8px 0}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--zebra);border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre}

/* glassmorphism */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(520px 420px at 92% 6%,rgba(214,40,46,.22),transparent 70%),
    radial-gradient(460px 380px at 30% 96%,rgba(214,40,46,.16),transparent 70%),
    radial-gradient(600px 500px at 60% 45%,rgba(255,255,255,.9),transparent 70%),
    linear-gradient(160deg,#ffffff 0%,#f8eeee 55%,#fdf9f9 100%)}
body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:340px;height:340px;right:6%;bottom:8%;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,120,120,.35),rgba(176,30,34,.18) 60%,transparent 72%);filter:blur(30px)}
.card,.period,.sem{background:var(--surface);border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}
.side{-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(255,255,255,.18);border-left:0;border-top:0}
.nav-item{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 16px rgba(60,0,4,.18),inset 0 1px 0 rgba(255,255,255,.18)}
.nav-item.pill,.sub-item.on{background:rgba(255,255,255,.92);color:#8a1418;border-color:transparent}
.seal{background:rgba(255,255,255,.9)}
.term{background:rgba(255,255,255,.6);border:1px solid var(--glass-edge)}
.term.final{background:linear-gradient(160deg,rgba(214,40,46,.95),rgba(112,12,16,.95));border-color:rgba(255,255,255,.3)}
.btn{background:rgba(255,255,255,.7);border-color:var(--glass-edge);box-shadow:0 2px 8px rgba(140,20,24,.06)}
.btn.primary{background:linear-gradient(160deg,#d0262b,#7c1014)}
.seg{background:rgba(176,30,34,.07)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95)}
.pres{background:rgba(176,30,34,.04);border-top:1px solid var(--line)}
input,select{border-color:rgba(120,30,34,.14)}
input:focus,select:focus{background:#fff}
.chip.none{background:rgba(120,30,34,.06)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.period,.sem{background:rgba(255,255,255,.94)}}
@media (max-width:600px){
  .crow{grid-template-columns:minmax(0,1fr) 40px 96px;grid-template-areas:"code u g" "title u g";min-width:0;padding-inline:16px;row-gap:2px}
  .crow.head{display:none}
  .crow .code{grid-area:code;text-align:left;font-weight:600;color:var(--accent)}
  .crow .code small{display:inline;margin-left:6px}
  .crow .title{grid-area:title;text-align:left}
  .crow .u{grid-area:u}
  .crow>select{grid-area:g}
}

/* my subjects */
.steps{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-bottom:22px}
@media (max-width:1000px){.steps{grid-template-columns:minmax(0,1fr)}}
.stepno{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(160deg,#d0262b,#7c1014);color:#fff;font-size:11px;margin-right:10px;vertical-align:1px}
.pickrow{display:flex;flex-direction:column;gap:12px}
.seg.big{display:flex;flex-wrap:wrap;width:100%;gap:4px;border-radius:14px;padding:4px}
.seg.big button{flex:1 1 0;font-size:13px;padding:11px 10px;border-radius:11px;min-width:0}
.seg.big button[aria-pressed="true"]{background:linear-gradient(160deg,#d0262b,#7c1014);color:#fff;box-shadow:0 4px 12px rgba(176,30,34,.3)}
.howto{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.crow.m{grid-template-columns:120px minmax(220px,1fr) 64px 110px 96px;min-width:640px}
.crow .act{padding:7px 12px}
.hint{display:block;margin:6px auto 0;background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;font:600 11px var(--f);padding:4px 10px;cursor:pointer;text-transform:none}
.semfoot.big{font-size:14px}
.semfoot.big b{font-size:18px;color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
@media (max-width:600px){
  .crow.m{grid-template-columns:minmax(0,1fr) 40px 96px;grid-template-areas:"code u g" "title title act";min-width:0}
  .crow.m .act{grid-area:act}
  .hint{margin-left:0}
  .seg.big button{flex:1 1 40%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="seal" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M32 6 52 13v17c0 13-8.5 22.5-20 28C20.5 52.5 12 43 12 30V13z" fill="#a11d1f"/><path d="M32 12 46 17v13c0 9.6-6 17-14 21.6C24 47 18 39.6 18 30V17z" fill="#fff"/><text x="32" y="36.5" text-anchor="middle" font-family="Poppins,Segoe UI,sans-serif" font-weight="800" font-size="12" fill="#a11d1f">SOC</text></svg></div>
      <div class="brand-name">HAU SOC Grader</div>
    </div>
    <nav class="nav" role="tablist" aria-label="Sections">
      <button class="nav-item" role="tab" id="tab-mine" data-act="tab" data-t="mine">My Subjects</button>
      <button class="nav-item" role="tab" id="tab-course" data-act="tab" data-t="course">Course Grade</button>
      <div class="subnav" id="subnav"></div>
      <button class="nav-item" role="tab" id="tab-gwa" data-act="tab" data-t="gwa">All Semesters</button>
      <button class="nav-item" role="tab" id="tab-ref" data-act="tab" data-t="ref">Grading Rules</button>
    </nav>
    <div class="side-foot">© HAU-SOC-GRADER · BSIT Web Dev 2022</div>
  </aside>
  <main class="main">
    <h1 class="page-title" id="pageTitle">Course Grade Calculator</h1>
    <div id="root">
      <section class="panel" id="panel-mine"></section>
      <section class="panel" id="panel-course"></section>
      <section class="panel" id="panel-gwa"></section>
      <section class="panel" id="panel-ref"></section>
    </div>
    <p class="quote">“Good students aim for good grades. Great students aim for understanding.”<span>– Maxim Legace</span></p>
  </main>
</div>

<script>
(function(){
/* ---------- data from the handbook & curriculum ---------- */
const SCALE=[[97,1.00,'A','Outstanding'],[94,1.25,'A-','Excellent'],[91,1.50,'B+','Superior'],[88,1.75,'B','Very Good'],[85,2.00,'B-','Good'],[82,2.25,'C+','Satisfactory'],[79,2.50,'C','Fairly Satisfactory'],[76,2.75,'C-','Fair'],[75,3.00,'D','Passed']];
const CUR=[

/* ---------- math ---------- */
function num(v){if(v===''||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null}
function f2(n){return n==null?'—':(Math.round(n*100)/100).toFixed(2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function eqGrade(t){for(const r of SCALE)if(t>=r[0])return r[1];return 5}
function transmute(c,P){return 75+(c-P)*25/(100-P)}
function settle(t,mode){return mode==='round'?Math.round(t):Math.floor(t+1e-9)}
function gradeText(g){return g==null?'—':g.toFixed(2)}
function examPct(p){
  const ls=num(p.lec.s),lm=num(p.lec.m),bs=num(p.lab.s),bm=num(p.lab.m);
  const L=ls!=null&&lm>0,B=bs!=null&&bm>0;
  if(L&&B){if(p.method==='raw')return (ls+bs)/(lm+bm);if(p.method==='avg')return (ls/lm+bs/bm)/2;const w=Math.min(100,Math.max(0,num(p.lecW)??50))/100;return ls/lm*w+bs/bm*(1-w)}
  if(L)return ls/lm;if(B)return bs/bm;return null;
}
function period(s,p){
  const cw=num(s.csW)??65,ew=num(s.exW)??35,W=cw+ew;let cs=null,ex=null,csRaw=null;
  if(p.mode==='quick'){cs=num(p.cs);ex=num(p.ex)}
  else{let a=0,b=0;for(const it of p.items){const x=num(it.s),y=num(it.m);if(x!=null&&y>0){a+=x;b+=y}}
    if(b>0){cs=a/b*cw;csRaw=[a,b]}const e=examPct(p);if(e!=null)ex=e*ew}
  const term=(cs!=null&&ex!=null&&W>0)?(cs+ex)/W*100:null;
  return {cs,ex,term,cw,ew,W,csRaw};
}
function compute(s){
  const P=num(s.pass)??50;const per=s.periods.map(p=>period(s,p));const out=[];let sum=0,ok=true;
  per.forEach((r,i)=>{if(r.term==null)ok=false;else sum+=r.term;
    const cum=ok?sum/(i+1):null;const t=cum!=null?transmute(cum,P):null;
    out.push(Object.assign({},r,{cum,tr:t,grade:t!=null?eqGrade(settle(t,s.round)):null}))});
  return out;
}

    return {code,title};
  });
}
function openSubject(code,name){

function renderSubnav(){

}
function updateCourse(){
  const s=sub();const R=compute(s);const P=num(s.pass)??50;
  R.forEach((r,i)=>{
    const el=document.getElementById('o'+i);if(!el)return;
    const g=r.grade;const cls=g==null?'none':g<=1.75?'good':g<=2.75?'':g<=3?'warn':'bad';
    el.innerHTML=`<span>CS <b>${f2(r.cs)}</b> / ${f2(r.cw)}</span><span>Exam <b>${f2(r.ex)}</b> / ${f2(r.ew)}</span><span>Term <b>${f2(r.term)}</b></span><span>Cumulative <b>${f2(r.cum)}</b> → <b>${r.tr==null?'—':f2(r.tr)}</b></span><span class="chip ${cls}">${gradeText(g)}</span>`;
    const raw=document.getElementById('o'+i+'raw');if(raw)raw.textContent=r.csRaw?`Total ${f2(r.csRaw[0])} / ${f2(r.csRaw[1])} = ${f2(r.csRaw[0]/r.csRaw[1]*100)}%`:'';
    const wl=document.getElementById('e'+i+'wl');if(wl)wl.hidden=s.periods[i].method!=='w';
  });
  document.getElementById('sumTitle').textContent=(s.code||'Subject')+' grades';
  document.getElementById('terms').innerHTML=R.map((r,i)=>`<div class="term${i===2?' final':''}"><div class="lbl">${i===2?'Final grade':PNAMES[i]}</div><div class="g">${gradeText(r.grade)}</div><div class="t">${r.tr==null?'incomplete':'transmuted '+f2(r.tr)}</div></div>`).join('');
  // ladder
  const L=document.getElementById('ladder');const f=R[2];
  if(R[0].term==null||R[1].term==null){L.innerHTML='<p class="note">Fill in Prelim and Midterm first.</p>';}
  else if(f.cs==null){L.innerHTML='<p class="note">Enter your Finals class standing to see the exam score you need.</p>';}
  else{
    const p=s.periods[2];const lm=num(p.lec.m),bm=num(p.lab.m);const totalItems=(p.mode==='itemized'&&p.method==='raw'&&lm>0&&bm>0)?lm+bm:null;
    const rows=SCALE.map(([min,g])=>{
      const thr=s.round==='round'?min-0.5:min;const creq=P+(thr-75)*(100-P)/25;const t3=3*creq-R[0].term-R[1].term;const exReq=t3*f.W/100-f.cs;const pct=exReq/f.ew*100;
      let txt;if(pct<=0)txt='<span class="chip good">secured</span>';else if(pct>100)txt='<span class="muted">out of reach</span>';else txt=`<span class="mono">${f2(pct)}%${totalItems?` · ${Math.ceil(pct/100*totalItems-1e-9)}/${totalItems}`:''}</span>`;
      return `<tr class="${f.grade===g?'cur':''}"><td class="mono">${g.toFixed(2)}</td><td>${txt}</td></tr>`}).join('');
    L.innerHTML=`<table class="ladder"><thead><tr><th>Final grade</th><th>Finals exam needed</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">Uses your current Finals class standing (${f2(f.cs)} / ${f2(f.cw)}). The highlighted row is where your current Finals exam score puts you.</p>`;
  }
  const o=document.querySelector('#subSel option[value="'+s.id+'"]');if(o)o.textContent=(s.code?s.code+' · ':'')+s.name;
  const si=document.querySelector('.sub-item.on');if(si)si.textContent=s.code||s.name;
}

/* ---------- GWA panel ---------- */
function rowsOf(sem){return sem.c.map(([code,title,units,nstp])=>({code,title,units,nstp:!!nstp}))}
function gwaCalc(rows){
  let s=0,u=0,worst=0,fails=0,missing=0,earned=0,graded=0;
  rows.forEach(r=>{const g=S.gwa.grades[r.code];if(!g||g==='INC'){missing++;return}const v=+g;graded++;
    if(v<=3)earned+=r.units;if(v===9)return;if(v>=5)fails++;
    if(r.nstp&&!S.gwa.nstp)return;
    const e=v>=5?5:v;s+=e*r.units;u+=r.units;if(!r.nstp)worst=Math.max(worst,v)});
  return {gwa:u?s/u:null,units:u,worst,fails,missing,earned,graded};
}
function semStatus(c,total){
  if(c.gwa==null)return '<span class="chip none">no grades yet</span>';
  if(c.fails)return `<span class="chip bad">${c.fails} failing</span>`;
  const partial=c.missing>0;let h=null;
  if(c.worst<=2&&c.gwa<=1.25)h="President's List";else if(c.worst<=2&&c.gwa<=1.75)h="Dean's List";
  if(h)return `<span class="chip good">${partial?'on track: ':''}${h}</span>`;
  if(c.worst>2&&c.gwa<=1.75)return '<span class="chip warn">a grade below 2.00 blocks honors</span>';
  return '<span class="chip none">no honors</span>';
}

    return `<section class="sem"><header><h3>${sem.sem}</h3><span id="ss${k}"></span></header><div class="ctable"><div class="crow head"><span>Code</span><span>Subjects</span><span>Units</span><span>Grade</span></div>${rows}</div><div class="semfoot"><span>Semestral GWA <b class="mono" id="sg${k}">—</b></span><span class="muted" id="su${k}"></span></div></section>`}).join('');
  document.getElementById('panel-gwa').innerHTML=`
    <div class="gwahead">
      <div class="card stat"><div class="k">Cumulative GWA</div><div class="v" id="gAll">—</div></div>
      <div class="card stat"><div class="k">Units earned</div><div class="v" id="gUnits">0</div><div class="small muted">of 165 in the curriculum</div></div>
      <div class="card stat"><div class="k">Latin honors standing</div><div class="v" id="gLatin" style="font-size:20px;padding-top:6px">—</div></div>
      <div class="card stat"><div class="k">Courses graded</div><div class="v" id="gCount">0</div></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="optNstp" data-g="nstp"${S.gwa.nstp?' checked':''}> Count CWTS (NSTP) in the GWA</label>
      <button class="btn" data-act="clear-gwa" id="clearGwa">Clear all grades</button>
    </div>
    <div class="sems">${sems}</div>
    <p class="note">FA (6.0) and UW (8.0) count as 5.0 in the average. DRP (9.0), INC and blank courses are left out. PE (TPE) is included, as the handbook requires.</p>`;
  updateGWA();
}
function updateGWA(){
  let all=[];CUR.forEach((sem,k)=>{const rows=rowsOf(sem);all=all.concat(rows);const c=gwaCalc(rows);
    document.getElementById('sg'+k).textContent=c.gwa==null?'—':c.gwa.toFixed(3);
    document.getElementById('su'+k).textContent=c.units?`${c.units} units counted${c.missing?` · ${c.missing} not graded`:''}`:'';
    document.getElementById('ss'+k).innerHTML=semStatus(c)});
  const c=gwaCalc(all);
  document.getElementById('gAll').textContent=c.gwa==null?'—':c.gwa.toFixed(3);
  document.getElementById('gUnits').textContent=c.earned;
  document.getElementById('gCount').textContent=c.graded;
  let latin='—';
  if(c.gwa!=null){if(c.fails)latin='Not eligible (failing mark)';else if(c.worst>2)latin='Not eligible (grade below 2.00)';else if(c.gwa<=1.25)latin='Summa Cum Laude';else if(c.gwa<=1.5)latin='Magna Cum Laude';else if(c.gwa<=1.75)latin='Cum Laude';else latin='Above 1.75';}
  document.getElementById('gLatin').textContent=latin;
}


/* ---------- my subjects panel ---------- */
const YEARS=['1st Year','2nd Year','3rd Year','4th Year'],SEMS=['1st Semester','2nd Semester'];
function semIdx(){return (S.year-1)*2+(S.sem-1)}
function calcGradeFor(code){const x=S.subjects.find(q=>(q.code||'').toUpperCase()===code);if(!x)return null;const R=compute(x);return R[2].grade}
function renderMine(){
  const k=semIdx(),sem=CUR[k];
  const rows=rowsOf(sem).map(r=>{
    const isE=/^ELECTIVE/.test(r.code);const sel=S.gwa.grades[r.code]||'';
    let title=esc(r.title);
    if(isE){const ch=S.gwa.elect[r.code]||'';title=`${esc(r.title)}<select class="elec" id="me-${r.code}" data-g="e.${r.code}" aria-label="Choose ${esc(r.title)}"><option value="">Choose elective…</option>${ELECT.map(e=>`<option value="${e[0]}"${ch===e[0]?' selected':''}>${e[0]} · ${esc(e[1])}</option>`).join('')}</select>`}
    const lookup=isE?(S.gwa.elect[r.code]||''):r.code;const cg=lookup?calcGradeFor(lookup):null;
    const hint=cg!=null&&(!sel||+sel!==cg)?`<button class="hint" data-act="use" data-code="${r.code}" data-g="${cg.toFixed(2)}">Calculator says ${cg.toFixed(2)} · use it</button>`:'';
    return `<div class="crow m"><div class="code">${r.code}${r.nstp?'<small>NSTP</small>':''}</div><div class="title">${title}${hint}</div><div class="u">${r.units.toFixed(2)}</div>
      <select id="m-${r.code}" data-g="g.${r.code}" aria-label="Final grade for ${r.code}">${GOPTS.map(o=>`<option value="${o[0]}"${sel===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>
      <button class="btn act" data-act="compute" data-code="${r.code}" data-name="${esc(r.title)}">Compute</button></div>`}).join('');
  document.getElementById('panel-mine').innerHTML=`
   <div class="steps">
    <div class="card"><h2><span class="stepno">1</span>Choose your year and semester</h2>
      <div class="pickrow">
        <div class="seg big" role="group" aria-label="Year level">${YEARS.map((y,i)=>`<button data-act="year" data-v="${i+1}" aria-pressed="${S.year===i+1}">${y}</button>`).join('')}</div>
        <div class="seg big" role="group" aria-label="Semester">${SEMS.map((y,i)=>`<button data-act="sem" data-v="${i+1}" aria-pressed="${S.sem===i+1}">${y}</button>`).join('')}</div>
      </div></div>
    <div class="card how"><h2><span class="stepno">2</span>Enter your grades</h2>
      <ul class="howto">
        <li><b>Already know your final grade?</b> Pick it in the Grade column.</li>
        <li><b>Still in the middle of the sem?</b> Tap <b>Compute</b> to work it out from your Prelim, Midterm and Finals scores.</li>
        <li>Your semestral GWA and Dean's List standing update right away.</li>
      </ul></div>
   </div>
   <section class="sem mine-table">
    <header><h3>${YEARS[S.year-1]} · ${SEMS[S.sem-1]}</h3><span id="mStatus"></span></header>
    <div class="ctable"><div class="crow m head"><span>Code</span><span>Subjects</span><span>Units</span><span>Grade</span><span></span></div>${rows}</div>
    <div class="semfoot big"><span>Semestral GWA <b class="mono" id="mGwa">—</b></span><span class="muted" id="mUnits"></span></div>
   </section>
   <div class="msg" id="mineMsg"></div>
   <p class="note">Need your cumulative GWA or Latin honors standing? Open <button class="linkbtn" data-act="tab" data-t="gwa">All Semesters</button>.</p>`;
  updateMine();
}
function updateMine(){
  const el=document.getElementById('mGwa');if(!el)return;
  const c=gwaCalc(rowsOf(CUR[semIdx()]));
  el.textContent=c.gwa==null?'—':c.gwa.toFixed(3);
  document.getElementById('mUnits').textContent=c.units?`${c.units} units counted${c.missing?` · ${c.missing} not graded yet`:''}`:'Pick a grade or tap Compute to start';
  document.getElementById('mStatus').innerHTML=semStatus(c);
}
/* ---------- reference panel ---------- */
function renderRef(){
  document.getElementById('panel-ref').innerHTML=`<div class="ref">
   <div class="card"><h2>Table of grade equivalents</h2>
    <div class="tbl"><table class="eq"><thead><tr><th>Grade</th><th>Letter</th><th>Percentage</th><th>Classification</th></tr></thead><tbody>
    ${SCALE.map((r,i)=>`<tr><td class="mono">${r[1].toFixed(2)}</td><td>${r[2]}</td><td class="mono">${i===0?'97 and above':i===SCALE.length-1?'75':r[0]+' – '+(SCALE[i-1][0]-1)}</td><td>${r[3]}</td></tr>`).join('')}
    <tr><td class="mono">5.00</td><td>F</td><td class="mono">below 75</td><td>Failed</td></tr>
    <tr><td class="mono">6.0</td><td>FA</td><td></td><td>Failure due to absences</td></tr>
    <tr><td class="mono">8.0</td><td>UW</td><td></td><td>Unauthorized or unreported withdrawal</td></tr>
    <tr><td class="mono">9.0</td><td>DRP</td><td></td><td>Dropped (with permission)</td></tr></tbody></table></div>
    <p class="note">Student Handbook 2025–2026, p. 31.</p></div>
   <div class="card"><h2>How a course grade is computed</h2>
    <p>Each term has three exams (Prelim, Midterm, Finals). Your ERP class page sets the shares, e.g. Class Standing 65% and Major Exam 35%, with a passing percentage of 50.</p>
    <div class="formula">term       = class standing pts + exam pts
cumulative = average of terms so far
transmuted = 75 + (cumulative − passing) × 25 ÷ (100 − passing)
grade      = equivalent of the transmuted value</div>
    <p>Check with your IASEC Midterm: (81 + 75) ÷ 2 = 78 → 75 + 28 × 0.5 = 89 → <b>1.75</b>. Your Prelim (81 → 90.5) shows as 1.75, so the ERP drops the decimals instead of rounding up.</p>
    <p class="note">How lecture and lab exams are merged depends on the instructor or syllabus. The calculator lets you pick the method.</p></div>
   <div class="card"><h2>Honors</h2>
    <ul><li><b>President's List:</b> semestral GWA 1.00–1.25</li><li><b>Dean's List:</b> semestral GWA 1.26–1.75</li><li>No grade lower than 2.00 in any subject (NSTP only needs a pass). All registered units count, TPE included. You must carry the full curriculum load.</li></ul>
    <ul><li><b>Summa Cum Laude:</b> 1.00–1.25</li><li><b>Magna Cum Laude:</b> above 1.25 to 1.50</li><li><b>Cum Laude:</b> above 1.50 to 1.75</li><li>No grade lower than 2.00 in all academic subjects, no FA or UW marks, TPE passed in the first two years, NSTP in the first year.</li></ul>
    <p class="note">Handbook pp. 32 and 54–55.</p></div>
   <div class="card"><h2>Other rules that affect grades</h2>
    <ul><li>More than 20% absences gives an FA (6.0). Limits: 3 absences for once-a-week classes, 7 for twice a week, 10 for three times a week.</li>
    <li>Dropping before the midterm exam gives DRP. Stopping without the form gives UW.</li>
    <li>No credit for an advanced subject if you fail its prerequisite.</li>
    <li>School of Computing: failing a professional course three times, or failing 50% of courses, means you'll be advised to shift programs.</li>
    <li>A faculty member can file a change of grade within one school year.</li></ul>
    <p class="note">Handbook pp. 29–31 and 73. Curriculum: BSITAreaWebDev2022, 165 units.</p></div>
  </div>`;
}

/* ---------- wiring ---------- */
const TITLES={mine:'My Subjects',course:'Course Grade Calculator',gwa:'All Semesters · GWA',ref:'Grading Rules'};
function setTab(t){S.tab=t;['mine','course','gwa','ref'].forEach(x=>{document.getElementById('panel-'+x).hidden=x!==t;const b=document.getElementById('tab-'+x);b.setAttribute('aria-selected',x===t);b.classList.toggle('pill',x===t&&x!=='course')});
  const n=document.getElementById('subnav');if(n)n.hidden=t!=='course';
  const sm=window.matchMedia&&window.matchMedia('(max-width:860px)').matches;if(sm)document.getElementById('tab-course').classList.toggle('pill',t==='course');
  document.getElementById('pageTitle').textContent=TITLES[t];renderSubnav();save()}
function setPath(path,val){
  const s=sub();const parts=path.split('.');let o;
  if(parts[0]==='sub'){s[parts[1]]=val;return}
  o=s.periods;parts.shift();
  for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;
}
const root=document.body;
function onField(e){
  const el=e.target;
  if(el.id==='subSel'){const v=el.value;
    if(v.startsWith('c:')){const code=v.slice(2);const it=semSubjects().find(x=>x.code===code);openSubject(code,it?it.title:code)}
    else S.cur=v.slice(3);
    save();renderCourse();return}
  if(el.dataset.k){setPath(el.dataset.k,el.value);save();
    if(['sub.csW','sub.exW'].includes(el.dataset.k)&&e.type==='change'){renderCourse();return}
    updateCourse();return}
  const g=el.dataset.g;if(!g)return;
  if(g==='nstp')S.gwa.nstp=el.checked;
  else if(g.startsWith('g.')){const c=g.slice(2);if(el.value)S.gwa.grades[c]=el.value;else delete S.gwa.grades[c]}
  else if(g.startsWith('e.')){S.gwa.elect[g.slice(2)]=el.value;if(e.type==='change')renderCourse()}
  save();updateGWA();updateMine();
  const inMine=!!el.closest('#panel-mine');if(e.type==='change'){if(inMine)renderGWA();else renderMine()}
}
root.addEventListener('input',onField);
root.addEventListener('change',onField);
let delArm=0,clrArm=0;
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const s=sub();
  if(a==='tab'){setTab(b.dataset.t);window.scrollTo(0,0);return}
  if(a==='year'){S.year=+b.dataset.v;save();renderMine();renderCourse();return}
  if(a==='sem'){S.sem=+b.dataset.v;save();renderMine();renderCourse();return}
  if(a==='compute'){
    let code=b.dataset.code,name=b.dataset.name;
    if(/^ELECTIVE/.test(code)){const ch=S.gwa.elect[code];const msg=document.getElementById('mineMsg');
      if(!ch){if(msg)msg.textContent='Choose which IT elective you are taking first.';return}
      const e=ELECT.find(x=>x[0]===ch);code=ch;name=e?e[1]:name}
    openSubject(code,name);save();renderCourse();setTab('course');window.scrollTo(0,0);return}
  if(a==='use'){S.gwa.grades[b.dataset.code]=b.dataset.g;save();renderMine();renderGWA();return}
  if(a==='open-sub'){openSubject(b.dataset.code,b.dataset.name);if(S.tab!=='course')setTab('course');save();renderCourse();return}
  if(a==='pick-sub'){S.cur=b.dataset.id;if(S.tab!=='course')setTab('course');save();renderCourse();return}
  if(a==='mode'){s.periods[+b.dataset.i].mode=b.dataset.m;save();renderCourse();return}
  if(a==='add-item'){const p=s.periods[+b.dataset.i];p.items.push({n:'',s:'',m:''});save();renderCourse();const j=p.items.length-1;const el=document.getElementById('i'+b.dataset.i+'n'+j);if(el)el.focus();return}
  if(a==='del-item'){const p=s.periods[+b.dataset.i];p.items.splice(+b.dataset.j,1);if(!p.items.length)p.items.push({n:'',s:'',m:''});save();renderCourse();return}
  if(a==='add-sub'){const n=blankSubject();S.subjects.push(n);S.cur=n.id;save();renderCourse();document.getElementById('sCode').focus();return}
  if(a==='del-sub'){if(S.subjects.length<2)return;
    if(Date.now()-delArm>3000){delArm=Date.now();b.textContent='Tap again to delete';setTimeout(()=>{if(b.isConnected)b.textContent='Delete'},3000);return}
    S.subjects=S.subjects.filter(x=>x.id!==s.id);S.cur=S.subjects[0].id;delArm=0;save();renderCourse();return}
  if(a==='clear-gwa'){
    if(Date.now()-clrArm>3000){clrArm=Date.now();b.textContent='Tap again to clear';setTimeout(()=>{if(b.isConnected)b.textContent='Clear all grades'},3000);return}
    S.gwa.grades={};clrArm=0;save();renderGWA();return}
  if(a==='send'){
    const R=compute(s);const g=R[2].grade;const m=document.getElementById('sendMsg');
    if(g==null){m.textContent='Finish all three terms first.';return}
    const code=(s.code||'').trim().toUpperCase();let slot=null;
    CUR.forEach(sem=>sem.c.forEach(c=>{if(c[0]===code)slot=c[0]}));
    if(!slot)Object.keys(S.gwa.elect).forEach(k=>{if(S.gwa.elect[k]===code)slot=k});
    if(!slot&&ELECT.some(e=>e[0]===code)){const free=['ELECTIVE1','ELECTIVE2','ELECTIVE3','ELECTIVE4'].find(k=>!S.gwa.elect[k]);if(free){S.gwa.elect[free]=code;slot=free}}
    if(!slot){m.textContent=code?`${code} isn't in the BSIT Web Dev curriculum. Check the course code.`:'Enter the course code first.';return}
    S.gwa.grades[slot]=g.toFixed(2);save();renderGWA();renderMine();m.textContent=`Saved ${g.toFixed(2)} as your ${code} grade in My Subjects.`;return}
});
renderMine();renderCourse();renderGWA();renderRef();setTab(S.tab||'mine');
})();
</script>
