services:
  - type: web
    name: hau-soc-grader-app
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: hau_soc_grader
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
